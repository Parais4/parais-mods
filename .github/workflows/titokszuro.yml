# Titokszuro (Marveen-atvetel 5): gitleaks a teljes git-elozmenyen, pozitiv kontrollal.
# "Nem szkennelheto" = hiba: ha a kontroll nem talalja az elultetett alkulcsot, vagy 0 commit lett szkennelve, a futas bukik.
# Forras: Claudekod/_self-improve/git-orok/titokszuro.yml (a vaultban; itt ne szerkeszd kulon).
name: titokszuro
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks telepitese (ellenorzott checksum)
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$f" "$base/$f"
          curl -sSfL -o sums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" sums.txt | sha256sum -c -
          tar xzf "$f" gitleaks
          rm -f "$f" sums.txt
          ./gitleaks version
      - name: Pozitiv kontroll (az elultetett alkulcsot MEG KELL talalnia)
        run: |
          set -uo pipefail
          d="$(mktemp -d)"
          echo "token=ghp_$(head -c 300 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > "$d/ultetett.txt"
          ./gitleaks dir "$d" --no-banner --redact --exit-code 7 > /dev/null 2>&1
          kod=$?
          rm -rf "$d"
          if [ "$kod" -ne 7 ]; then echo "KONTROLL BUKOTT (exit $kod): a gitleaks nem talalta az elultetett alkulcsot, az eredmeny nem meres."; exit 1; fi
          echo "kontroll rendben (exit 7)"
      - name: Teljes elozmeny szkennelese
        run: |
          set -uo pipefail
          ./gitleaks git . --no-banner --redact --log-opts="--all" --exit-code 1 > gitleaks.log 2>&1
          kod=$?
          sed 's/\x1b\[[0-9;]*m//g' gitleaks.log
          n=$(sed 's/\x1b\[[0-9;]*m//g' gitleaks.log | grep -Eo '[0-9]+ commits scanned' | grep -Eo '^[0-9]+' || true)
          if [ "${n:-0}" -lt 1 ]; then echo "NEM SZKENNELHETO: 0 commit vagy olvashatatlan kimenet (bukas)"; exit 1; fi
          exit $kod
